<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live Object Detector</title>
<style>
:root{color-scheme:dark;--bg:#0a0d12;--fg:#e8edf3;--mut:#7c8696;--card:#151a22;--ac:#2ee59d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;padding:10px;max-width:760px;margin-inline:auto}
#box{position:relative;width:100%;background:#000;border-radius:12px;overflow:hidden;border:1px solid #243;aspect-ratio:4/3}
video,canvas{position:absolute;inset:0;width:100%;height:100%}
video.mirror{transform:scaleX(-1)}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000c;font-weight:700;text-align:center;padding:20px}
.row{display:flex;gap:8px;margin:8px 0;align-items:center}
button{padding:12px 14px;border:0;border-radius:10px;background:var(--card);color:var(--fg);font-weight:700}
.card{background:var(--card);border-radius:12px;padding:8px 12px;flex:1;display:flex;align-items:center;gap:8px;color:var(--mut)}
input[type=range]{flex:1}
#fps{min-width:64px;text-align:right;color:var(--ac);font-family:monospace;font-weight:700}
#cnt{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.chip{padding:5px 10px;border-radius:99px;font-weight:700;font-size:13px;color:#06100c}
</style>
</head>
<body>
<div id="box">
  <video id="v" playsinline muted autoplay></video>
  <canvas id="o"></canvas>
  <div id="load">Loading AI model...<br>(needs internet, first load only)</div>
</div>
<div class="row">
  <button id="sw">Switch camera</button>
  <div class="card">Min <input type="range" id="th" min="0.5" max="0.95" step="0.05" value="0.55"><span id="tv">55%</span></div>
  <div id="fps">-- FPS</div>
</div>
<div id="cnt"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const v = $('v'), o = $('o'), g = o.getContext('2d'), load = $('load');
let model = null, stream = null, facing = 'environment', fps = 0, last = performance.now();

function colorOf(name) {
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return 'hsl(' + h + ',90%,58%)';
}

async function startCamera() {
  if (!navigator.mediaDevices) {
    load.textContent = 'Camera blocked. Open this page over https:// (GitHub Pages) or from a local file on a computer.';
    return false;
  }
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false
    });
  } catch (e) {
    load.textContent = 'Camera error: ' + e.message;
    return false;
  }
  v.srcObject = stream;
  v.classList.toggle('mirror', facing === 'user');
  await v.play();
  return true;
}

$('sw').onclick = async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  await startCamera();
};
$('th').oninput = () => { $('tv').textContent = Math.round($('th').value * 100) + '%'; };

function draw(preds) {
  const vw = v.videoWidth, vh = v.videoHeight;
  if (o.width !== vw || o.height !== vh) { o.width = vw; o.height = vh; $('box').style.aspectRatio = vw + '/' + vh; }
  g.clearRect(0, 0, vw, vh);
  const mirror = facing === 'user', thr = +$('th').value, s = vw / 640;
  const counts = {};
  g.font = 'bold ' + Math.round(15 * s) + 'px system-ui,sans-serif';
  g.textBaseline = 'middle';
  for (const p of preds) {
    if (p.score < thr) continue;
    let [x, y, w, h] = p.bbox;
    if (mirror) x = vw - x - w;
    const col = colorOf(p.class);
    counts[p.class] = (counts[p.class] || 0) + 1;
    g.lineWidth = 3 * s; g.strokeStyle = col;
    g.strokeRect(x, y, w, h);
    const label = p.class + ' ' + Math.round(p.score * 100) + '%';
    const tw = g.measureText(label).width + 12 * s, th = 22 * s;
    const ty = y - th < 0 ? y : y - th;
    g.fillStyle = col; g.fillRect(x, ty, tw, th);
    g.fillStyle = '#04110b'; g.fillText(label, x + 6 * s, ty + th / 2);
  }
  $('cnt').innerHTML = Object.entries(counts)
    .map(([k, n]) => '<span class="chip" style="background:' + colorOf(k) + '">' + k + ' x' + n + '</span>').join('');
}

async function loop() {
  if (model && v.readyState >= 2 && v.videoWidth) {
    const preds = await model.detect(v, 20);
    draw(preds);
    const now = performance.now();
    fps = fps * 0.8 + (1000 / (now - last)) * 0.2; last = now;
    $('fps').textContent = fps.toFixed(0) + ' FPS';
  }
  requestAnimationFrame(loop);
}

(async () => {
  const ok = await startCamera();
  if (!ok) return;
  try {
    model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
  } catch (e) {
    load.textContent = 'Could not load the model. Check your internet connection.';
    return;
  }
  load.style.display = 'none';
  loop();
})();
</script>
</body>
</html>
