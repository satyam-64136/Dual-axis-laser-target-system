<rect x="0" y="0" width="1100" height="400" rx="0" fill="#0d1117" /><text x="30" y="34" dy="0.35em" font-size="22" fill="#e6edf3" font-weight="700" text-anchor="start"  >AUTO mode</text><rect x="60" y="90" width="260" height="100" rx="16" fill="#161b22" stroke="#ffcc00" stroke-width="2" /><text x="190" y="122" dy="0.35em" font-size="22" fill="#ffcc00" font-weight="800" text-anchor="middle"  >SCANNING</text><text x="190" y="152" dy="0.35em" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle"  >Sweeps pan and tilt</text><text x="190" y="170" dy="0.35em" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle"  >looking for the picked color</text><rect x="420" y="90" width="260" height="100" rx="16" fill="#161b22" stroke="#2ee59d" stroke-width="2" /><text x="550" y="122" dy="0.35em" font-size="22" fill="#2ee59d" font-weight="800" text-anchor="middle"  >TRACKING</text><text x="550" y="152" dy="0.35em" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle"  >Follows the target;</text><text x="550" y="170" dy="0.35em" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle"  >lock ring fills over 1 s</text><rect x="780" y="90" width="260" height="100" rx="16" fill="#161b22" stroke="#ff3b3b" stroke-width="2" /><text x="910" y="122" dy="0.35em" font-size="22" fill="#ff3b3b" font-weight="800" text-anchor="middle"  >LOCKED</text><text x="910" y="152" dy="0.35em" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle"  >Red brackets, beep,</text><text x="910" y="170" dy="0.35em" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle"  >lock counter +1</text><line x1="322" y1="140" x2="418" y2="140" stroke="#2ee59d" stroke-width="2.4" marker-end="url(#ag)"/><text x="370" y="122" dy="0.35em" font-size="12" fill="#8b949e" font-weight="400" text-anchor="middle"  >color found</text><line x1="682" y1="140" x2="778" y2="140" stroke="#2ee59d" stroke-width="2.4" marker-end="url(#ag)"/><text x="730" y="122" dy="0.35em" font-size="12" fill="#8b949e" font-weight="400" text-anchor="middle"  >seen for 1 s</text><path d="M550 192 C550 262 170 262 170 194" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#am)"/><text x="360" y="266" dy="0.35em" font-size="12" fill="#8b949e" font-weight="400" text-anchor="middle"  >target lost for 1.5 s</text><path d="M910 192 C910 350 230 350 230 194" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#am)"/><text x="570" y="338" dy="0.35em" font-size="12" fill="#8b949e" font-weight="400" text-anchor="middle"  >target lost for 1.5 s</text><text x="30" y="376" dy="0.35em" font-size="14" fill="#8b949e" font-weight="400" text-anchor="start"  >The laser follows the aim point in every state. Press AUTO to start; PICK a color first.</text>
