<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" font-family="'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs></defs>
<rect x="0" y="0" width="1100" height="500" rx="0" fill="#0d1117" /><text x="30" y="36" dy="0.35em" font-size="22" fill="#e6edf3" font-weight="700" text-anchor="start"  >What the tracker fixes</text><text x="30" y="64" dy="0.35em" font-size="14" fill="#8b949e" font-weight="400" text-anchor="start"  >Old = raw per-frame detections. New = tracked and smoothed. 300 frames of simulated noisy detections.</text><text x="30" y="100" dy="0.35em" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="start"  >Object visible (% of frames)</text><text x="30" y="130" dy="0.35em" font-size="13" fill="#8b949e" font-weight="400" text-anchor="start"  >Old</text><rect x="90" y="120" width="352.0" height="20" rx="5" fill="#6e7681" /><text x="452.0" y="130" dy="0.35em" font-size="14" fill="#8b949e" font-weight="700" text-anchor="start"  >55%</text><text x="30" y="158" dy="0.35em" font-size="13" fill="#8b949e" font-weight="400" text-anchor="start"  >New</text><rect x="90" y="148" width="633.6" height="20" rx="5" fill="#2ee59d" /><text x="733.6" y="158" dy="0.35em" font-size="14" fill="#e6edf3" font-weight="700" text-anchor="start"  >99%</text><text x="30" y="192" dy="0.35em" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="start"  >On / off flickers</text><text x="30" y="222" dy="0.35em" font-size="13" fill="#8b949e" font-weight="400" text-anchor="start"  >Old</text><rect x="90" y="212" width="640.0" height="20" rx="5" fill="#6e7681" /><text x="740.0" y="222" dy="0.35em" font-size="14" fill="#8b949e" font-weight="700" text-anchor="start"  >156</text><text x="30" y="250" dy="0.35em" font-size="13" fill="#8b949e" font-weight="400" text-anchor="start"  >New</text><rect x="90" y="240" width="4.102564102564102" height="20" rx="5" fill="#2ee59d" /><text x="104.1025641025641" y="250" dy="0.35em" font-size="14" fill="#e6edf3" font-weight="700" text-anchor="start"  >1</text><text x="30" y="284" dy="0.35em" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="start"  >Label switches (cup ↔ bottle)</text><text x="30" y="314" dy="0.35em" font-size="13" fill="#8b949e" font-weight="400" text-anchor="start"  >Old</text><rect x="90" y="304" width="640.0" height="20" rx="5" fill="#6e7681" /><text x="740.0" y="314" dy="0.35em" font-size="14" fill="#8b949e" font-weight="700" text-anchor="start"  >40</text><text x="30" y="342" dy="0.35em" font-size="13" fill="#8b949e" font-weight="400" text-anchor="start"  >New</text><rect x="90" y="332" width="3" height="20" rx="5" fill="#2ee59d" /><text x="103" y="342" dy="0.35em" font-size="14" fill="#e6edf3" font-weight="700" text-anchor="start"  >0</text><text x="30" y="376" dy="0.35em" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="start"  >Box jitter (px, lower is steadier)</text><text x="30" y="406" dy="0.35em" font-size="13" fill="#8b949e" font-weight="400" text-anchor="start"  >Old</text><rect x="90" y="396" width="640.0" height="20" rx="5" fill="#6e7681" /><text x="740.0" y="406" dy="0.35em" font-size="14" fill="#8b949e" font-weight="700" text-anchor="start"  >8.4 px</text><text x="30" y="434" dy="0.35em" font-size="13" fill="#8b949e" font-weight="400" text-anchor="start"  >New</text><rect x="90" y="424" width="365.7142857142857" height="20" rx="5" fill="#2ee59d" /><text x="465.7142857142857" y="434" dy="0.35em" font-size="14" fill="#e6edf3" font-weight="700" text-anchor="start"  >4.8 px</text><text x="30" y="478" dy="0.35em" font-size="13" fill="#8b949e" font-weight="400" text-anchor="start"  >Synthetic benchmark: it shows the logic works, not a real-camera accuracy test.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
