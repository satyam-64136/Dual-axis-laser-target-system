<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" font-family="system-ui,Segoe UI,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="490" fill="#ffffff"/>

<rect x="40" y="40" width="170" height="260" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<g fill="#444441" font-size="12" dominant-baseline="central">
<text x="125" y="64" text-anchor="middle" font-size="14" font-weight="600">ESP32</text>
<text x="196" y="92" text-anchor="end">GPIO 18</text>
<text x="196" y="172" text-anchor="end">GPIO 19</text>
<text x="196" y="252" text-anchor="end">GPIO 23</text>
<text x="125" y="282" text-anchor="middle">GND</text>
</g>

<g stroke="#EF9F27" stroke-width="2" fill="none">
<line x1="212" y1="92" x2="388" y2="92" marker-end="url(#ao)"/>
<line x1="212" y1="172" x2="388" y2="172" marker-end="url(#ao)"/>
<line x1="212" y1="252" x2="268" y2="252"/>
<line x1="332" y1="252" x2="388" y2="252" marker-end="url(#ao)"/>
</g>
<rect x="270" y="240" width="60" height="24" rx="4" fill="#ffffff" stroke="#5F5E5A"/>
<text x="300" y="252" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">100Ω</text>

<g dominant-baseline="central" font-size="12">
<rect x="390" y="60" width="250" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="515" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Pan servo (left-right)</text>
<circle cx="410" cy="106" r="5" fill="#E24B4A"/><text x="420" y="106" fill="#0F6E56">red → +5V</text>
<circle cx="510" cy="106" r="5" fill="#888780"/><text x="520" y="106" fill="#0F6E56">brown → GND</text>

<rect x="390" y="140" width="250" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="515" y="160" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Tilt servo (up-down)</text>
<circle cx="410" cy="186" r="5" fill="#E24B4A"/><text x="420" y="186" fill="#0F6E56">red → +5V</text>
<circle cx="510" cy="186" r="5" fill="#888780"/><text x="520" y="186" fill="#0F6E56">brown → GND</text>

<rect x="390" y="220" width="250" height="64" rx="10" fill="#FAECE7" stroke="#993C1D"/>
<text x="515" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Laser dot emitter</text>
<circle cx="410" cy="266" r="5" fill="#EF9F27"/><text x="420" y="266" fill="#993C1D">red (+) ← resistor</text>
<circle cx="560" cy="266" r="5" fill="#888780"/><text x="570" y="266" fill="#993C1D">black (−) → GND</text>
</g>

<path d="M125 302 V396 H238" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#ag)"/>

<g dominant-baseline="central" font-size="12">
<rect x="240" y="330" width="400" height="84" rx="10" fill="#FAEEDA" stroke="#854F0B"/>
<text x="440" y="350" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">5V power (power bank / charger)</text>
<circle cx="262" cy="376" r="5" fill="#E24B4A"/><text x="274" y="376" fill="#854F0B">+5V → both servo red wires</text>
<circle cx="262" cy="396" r="5" fill="#888780"/><text x="274" y="396" fill="#854F0B">GND → servo browns, laser black, ESP32 GND</text>
</g>

<g dominant-baseline="central" font-size="12" fill="#444441">
<line x1="40" y1="450" x2="70" y2="450" stroke="#EF9F27" stroke-width="2"/><text x="78" y="450">Signal wire</text>
<line x1="180" y1="450" x2="210" y2="450" stroke="#E24B4A" stroke-width="2"/><text x="218" y="450">+5V (red)</text>
<line x1="320" y1="450" x2="350" y2="450" stroke="#888780" stroke-width="2"/><text x="358" y="450">GND (brown/black)</text>
</g>
</svg>
